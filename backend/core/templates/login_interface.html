<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion RH</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      border-radius: 16px;
      width: min(420px, 90vw);
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h2 { margin-top: 0; text-align: center; }
    label { display: block; margin: 14px 0 8px; font-size: 0.95rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 1rem;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .result {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: #111827;
      display: none;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }
    .error { background: rgba(127,29,29,0.7); }
    .success { background: rgba(20,83,45,0.7); }
  </style>
</head>
<body>
  <div class="card">
    <h2>Connexion RH</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" value="admin.rh@example.com" required />

      <label for="password">Mot de passe</label>
      <input id="password" type="password" value="SecurePassword123!" required />

      <button type="submit">Se connecter</button>
    </form>

    
  </div>
</body>
</html>
